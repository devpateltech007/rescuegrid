<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff9900"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#0b0e12"/>

  <!-- title -->
  <path d="M60 92 L82 52 L104 92 Z" fill="none" stroke="#22d3ee" stroke-width="4"/>
  <circle cx="82" cy="79" r="6" fill="#ff4d4f"/>
  <text x="124" y="88" fill="#e2e8f0" font-size="40" font-weight="800" letter-spacing="5">RESCUEGRID <tspan fill="#22d3ee">3D</tspan></text>
  <text x="560" y="86" fill="#94a3b8" font-size="24">Architecture · Hurricane Helene replay, Swannanoa NC</text>

  <!-- data sources -->
  <text x="60" y="140" fill="#f59e0b" font-size="17" font-weight="700" letter-spacing="2">REAL PUBLIC DATA</text>
  <g font-size="19">
    <rect x="60" y="155" width="340" height="140" rx="12" fill="#121821" stroke="#2a3340" stroke-width="2"/>
    <text x="80" y="195" fill="#e2e8f0" font-weight="700" font-size="22">USGS 3DEP elevation</text>
    <text x="80" y="228" fill="#94a3b8">terrain grids, about 5 m and 30 m</text>
    <text x="80" y="258" fill="#94a3b8">real valley, river, ridgelines</text>

    <rect x="60" y="315" width="340" height="140" rx="12" fill="#121821" stroke="#2a3340" stroke-width="2"/>
    <text x="80" y="355" fill="#e2e8f0" font-weight="700" font-size="22">OpenStreetMap</text>
    <text x="80" y="388" fill="#94a3b8">road graph: 706 nodes, 1,584 edges</text>
    <text x="80" y="418" fill="#94a3b8">river + 3,165 buildings</text>

    <rect x="60" y="475" width="340" height="140" rx="12" fill="#121821" stroke="#2a3340" stroke-width="2"/>
    <text x="80" y="515" fill="#e2e8f0" font-weight="700" font-size="22">NOAA aerial imagery</text>
    <text x="80" y="548" fill="#94a3b8">post-storm flight, 5 Oct 2024</text>
    <text x="80" y="578" fill="#94a3b8">what Bedrock sees at the bridges</text>

    <rect x="60" y="635" width="340" height="140" rx="12" fill="#121821" stroke="#2a3340" stroke-width="2"/>
    <text x="80" y="675" fill="#e2e8f0" font-weight="700" font-size="22">NCDOT record</text>
    <text x="80" y="708" fill="#94a3b8">Whitson Ave Bridge washout</text>
    <text x="80" y="738" fill="#94a3b8">the real problem we replay</text>
  </g>
  <path d="M402 560 L486 560" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <text x="60" y="805" fill="#64748b" font-size="16">downloaded and prepared once by scripts</text>

  <!-- browser -->
  <rect x="490" y="120" width="870" height="190" rx="14" fill="#0f1a22" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="515" y="160" fill="#22d3ee" font-size="17" font-weight="700" letter-spacing="2">BROWSER · COMMAND CENTER</text>
  <text x="515" y="203" fill="#e2e8f0" font-size="25" font-weight="700">CesiumJS 3D globe</text>
  <text x="515" y="236" fill="#94a3b8" font-size="19">real terrain · NOAA overlay · drones · lidar points</text>
  <text x="515" y="264" fill="#94a3b8" font-size="19">rebuilt surface · road status · routes</text>
  <text x="960" y="203" fill="#e2e8f0" font-size="25" font-weight="700">React panels</text>
  <text x="960" y="236" fill="#94a3b8" font-size="19">drones · AI inspect · incidents</text>
  <text x="960" y="264" fill="#94a3b8" font-size="19">route approval · Bedrock briefing</text>

  <!-- commander -->
  <rect x="1440" y="120" width="420" height="190" rx="14" fill="#14201a" stroke="#4ade80" stroke-width="2.5"/>
  <text x="1465" y="160" fill="#4ade80" font-size="17" font-weight="700" letter-spacing="2">HUMAN IN THE LOOP</text>
  <text x="1465" y="203" fill="#e2e8f0" font-size="25" font-weight="700">Commander</text>
  <text x="1465" y="236" fill="#94a3b8" font-size="19">reviews drone evidence</text>
  <text x="1465" y="264" fill="#94a3b8" font-size="19">confirms hazards · approves route</text>
  <path d="M1438 215 L1364 215" stroke="#4ade80" stroke-width="3" marker-end="url(#a)"/>

  <!-- AWS region -->
  <rect x="470" y="345" width="1410" height="460" rx="18" fill="none" stroke="#ff9900" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="495" y="378" fill="#ff9900" font-size="17" font-weight="700" letter-spacing="2">AWS · us-east-1</text>
  <path d="M925 312 L925 395" stroke="#22d3ee" stroke-width="3" marker-start="url(#ac)" marker-end="url(#ac)"/>
  <text x="942" y="334" fill="#22d3ee" font-size="16">REST + live WebSocket</text>

  <!-- EC2 -->
  <rect x="490" y="398" width="870" height="390" rx="14" fill="#121821" stroke="#2a3340" stroke-width="2"/>
  <text x="515" y="435" fill="#e2e8f0" font-size="23" font-weight="700">Amazon EC2 <tspan fill="#94a3b8" font-weight="400" font-size="18">t3.large · nginx → FastAPI (Python)</tspan></text>
  <text x="515" y="463" fill="#64748b" font-size="16">IAM role, least privilege: one model, one bucket path, one log group. No keys on the server.</text>
  <g font-size="17">
    <rect x="510" y="482" width="270" height="140" rx="10" fill="#0b0e12" stroke="#334155"/>
    <text x="528" y="515" fill="#e2e8f0" font-weight="700" font-size="20">Mission engine</text>
    <text x="528" y="545" fill="#94a3b8">3 simulated drones</text>
    <text x="528" y="570" fill="#94a3b8">coordinator + retasking</text>
    <text x="528" y="595" fill="#94a3b8">deterministic replay</text>

    <rect x="790" y="482" width="270" height="140" rx="10" fill="#0b0e12" stroke="#334155"/>
    <text x="808" y="515" fill="#e2e8f0" font-weight="700" font-size="20">Synthetic lidar</text>
    <text x="808" y="545" fill="#94a3b8">rays cast on real terrain</text>
    <text x="808" y="570" fill="#94a3b8">change detection vs</text>
    <text x="808" y="595" fill="#94a3b8">pre-storm surface</text>

    <rect x="1070" y="482" width="270" height="140" rx="10" fill="#0b0e12" stroke="#334155"/>
    <text x="1088" y="515" fill="#e2e8f0" font-weight="700" font-size="20">GIS matcher</text>
    <text x="1088" y="545" fill="#94a3b8">drone pose → OSM roads</text>
    <text x="1088" y="570" fill="#94a3b8">(the model never picks</text>
    <text x="1088" y="595" fill="#94a3b8">coordinates or roads)</text>

    <rect x="510" y="634" width="270" height="140" rx="10" fill="#0b0e12" stroke="#334155"/>
    <text x="528" y="667" fill="#e2e8f0" font-weight="700" font-size="20">NetworkX router</text>
    <text x="528" y="697" fill="#94a3b8">real road graph</text>
    <text x="528" y="722" fill="#94a3b8">blocked edges removed</text>
    <text x="528" y="747" fill="#94a3b8">recalculates in ~30 ms</text>

    <rect x="790" y="634" width="270" height="140" rx="10" fill="#0b0e12" stroke="#334155"/>
    <text x="808" y="667" fill="#e2e8f0" font-weight="700" font-size="20">Validation</text>
    <text x="808" y="697" fill="#94a3b8">Pydantic checks every</text>
    <text x="808" y="722" fill="#94a3b8">Bedrock answer before</text>
    <text x="808" y="747" fill="#94a3b8">it can create an incident</text>

    <rect x="1070" y="634" width="270" height="140" rx="10" fill="#0b0e12" stroke="#334155"/>
    <text x="1088" y="667" fill="#e2e8f0" font-weight="700" font-size="20">SQLite</text>
    <text x="1088" y="697" fill="#94a3b8">observations · incidents</text>
    <text x="1088" y="722" fill="#94a3b8">decisions (audit log)</text>
    <text x="1088" y="747" fill="#94a3b8">routes · AI calls</text>
  </g>

  <!-- AWS managed services -->
  <rect x="1440" y="398" width="420" height="200" rx="14" fill="#1d1608" stroke="#ff9900" stroke-width="2.5"/>
  <text x="1465" y="435" fill="#ff9900" font-size="24" font-weight="800">Amazon Bedrock</text>
  <text x="1465" y="467" fill="#e2e8f0" font-size="20" font-weight="700">Claude Sonnet 4.5 · Converse API</text>
  <text x="1465" y="497" fill="#94a3b8" font-size="18">forced JSON tool, temperature 0</text>
  <text x="1465" y="533" fill="#e2e8f0" font-size="18">1. drone image → hazard assessment</text>
  <text x="1465" y="563" fill="#e2e8f0" font-size="18">2. database facts → mission briefing</text>
  <path d="M1362 520 L1438 520" stroke="#ff9900" stroke-width="3.5" marker-start="url(#ao)" marker-end="url(#ao)"/>

  <rect x="1440" y="612" width="420" height="82" rx="12" fill="#121821" stroke="#2a3340" stroke-width="2"/>
  <text x="1465" y="646" fill="#e2e8f0" font-size="21" font-weight="700">Amazon S3</text>
  <text x="1465" y="675" fill="#94a3b8" font-size="17">drone images · lidar chunks · briefings</text>
  <path d="M1362 655 L1438 655" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>

  <rect x="1440" y="706" width="420" height="82" rx="12" fill="#121821" stroke="#2a3340" stroke-width="2"/>
  <text x="1465" y="740" fill="#e2e8f0" font-size="21" font-weight="700">Amazon CloudWatch</text>
  <text x="1465" y="769" fill="#94a3b8" font-size="17">app logs · Bedrock metrics + call log</text>
  <path d="M1362 748 L1438 748" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>

  <!-- flow -->
  <text x="60" y="852" fill="#22d3ee" font-size="17" font-weight="700" letter-spacing="2">ONE DECISION, END TO END</text>
  <g font-size="18" font-weight="600">
    <rect x="60" y="868" width="232" height="66" rx="33" fill="#0f1a22" stroke="#22d3ee"/>
    <text x="176" y="908" fill="#e2e8f0" text-anchor="middle">1 · Drones scan</text>
    <rect x="320" y="868" width="232" height="66" rx="33" fill="#0f1a22" stroke="#22d3ee"/>
    <text x="436" y="908" fill="#e2e8f0" text-anchor="middle">2 · Lidar flags change</text>
    <rect x="580" y="868" width="232" height="66" rx="33" fill="#1d1608" stroke="#ff9900"/>
    <text x="696" y="908" fill="#e2e8f0" text-anchor="middle">3 · Bedrock reads image</text>
    <rect x="840" y="868" width="232" height="66" rx="33" fill="#0f1a22" stroke="#f59e0b"/>
    <text x="956" y="908" fill="#e2e8f0" text-anchor="middle">4 · Incident: pending</text>
    <rect x="1100" y="868" width="232" height="66" rx="33" fill="#14201a" stroke="#4ade80"/>
    <text x="1216" y="908" fill="#e2e8f0" text-anchor="middle">5 · Commander confirms</text>
    <rect x="1360" y="868" width="232" height="66" rx="33" fill="#0f1a22" stroke="#22d3ee"/>
    <text x="1476" y="908" fill="#e2e8f0" text-anchor="middle">6 · Graph reroutes</text>
    <rect x="1620" y="868" width="240" height="66" rx="33" fill="#1d1608" stroke="#ff9900"/>
    <text x="1740" y="908" fill="#e2e8f0" text-anchor="middle">7 · Bedrock briefing</text>
  </g>
  <g stroke="#64748b" stroke-width="2.5">
    <path d="M294 901 L318 901"/><path d="M554 901 L578 901"/><path d="M814 901 L838 901"/>
    <path d="M1074 901 L1098 901"/><path d="M1334 901 L1358 901"/><path d="M1594 901 L1618 901"/>
  </g>

  <!-- stack -->
  <line x1="60" y1="965" x2="1860" y2="965" stroke="#2a3340" stroke-width="2"/>
  <text x="60" y="1005" fill="#94a3b8" font-size="20"><tspan fill="#22d3ee" font-weight="700">Frontend </tspan>React 18 · TypeScript · Vite · Tailwind · Zustand · CesiumJS 1.122 (own terrain, no Cesium ion)</text>
  <text x="60" y="1042" fill="#94a3b8" font-size="20"><tspan fill="#22d3ee" font-weight="700">Backend </tspan>Python · FastAPI · Pydantic · NetworkX · OSMnx · Rasterio · NumPy · boto3 · SQLite<tspan dx="40" fill="#ff9900" font-weight="700">AWS </tspan>Bedrock · EC2 · S3 · CloudWatch · IAM</text>
</svg>
